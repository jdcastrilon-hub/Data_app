<mat-card appearance="raised">
  <mat-tab-group animationDuration="0ms" mat-stretch-tabs="false" mat-align-tabs="start">

    <mat-tab label="Filtros">
      <div class="bloque">
        <div fxLayout="row" fxLayoutAlign="start stretch" fxLayoutGap="8px">
          <div fxFlex="25">
            <mat-form-field class="form-field-compacto form-field-date" appearance="outline">
              <mat-label>Fecha de Desembolso</mat-label>
              <mat-date-range-input [rangePicker]="picker">
                <input matStartDate [(ngModel)]="filtro().fechaInicial">
                <input matEndDate [(ngModel)]="filtro().fechaFinal">
              </mat-date-range-input>
              <mat-datepicker-toggle matSuffix [for]="picker"></mat-datepicker-toggle>
              <mat-date-range-picker #picker></mat-date-range-picker>
              <mat-hint>Vacío = todos los desembolsos</mat-hint>
            </mat-form-field>
          </div>

          <div fxFlex="20">
            <mat-form-field class="form-field-compacto mat-form-field" appearance="outline">
              <mat-label>Estado</mat-label>
              <mat-select [formControl]="SelectEstadoControl">
                <mat-option value="TODOS">Todos</mat-option>
                @for (estado of estados; track estado) {
                <mat-option [value]="estado">{{ estado }}</mat-option>
                }
              </mat-select>
            </mat-form-field>
          </div>

          <div class="btn-consultar-wrapper" fxFlex="0 0 auto" fxLayoutAlign="start start">
            <button mat-flat-button color="primary" (click)="enviarConsulta()">
              <mat-icon>search</mat-icon> Consultar
            </button>
          </div>
        </div>
      </div>
    </mat-tab>

    <mat-tab label="Clientes">
      <div class="bloque">
        <div fxLayout="row" fxLayoutAlign="start center" fxLayoutGap="8px">
          <div fxFlex="50">
            <combo-cliente (clienteSelecionado)="agregarCliente($event)"></combo-cliente>
          </div>
        </div>

        <table mat-table [dataSource]="clientesSeleccionados" class="mat-elevation-z1">
          <ng-container matColumnDef="codTit">
            <th mat-header-cell *matHeaderCellDef>Documento</th>
            <td mat-cell *matCellDef="let cli">{{cli.codTit}}</td>
          </ng-container>

          <ng-container matColumnDef="nombreCompleto">
            <th mat-header-cell *matHeaderCellDef>Cliente</th>
            <td mat-cell *matCellDef="let cli">{{cli.nombreCompleto}}</td>
          </ng-container>

          <ng-container matColumnDef="acciones">
            <th mat-header-cell *matHeaderCellDef></th>
            <td mat-cell *matCellDef="let cli">
              <button mat-icon-button (click)="quitarCliente(cli)" type="button">
                <mat-icon>delete</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="columnasClientes"></tr>
          <tr mat-row *matRowDef="let row; columns: columnasClientes;"></tr>
        </table>

        @if (clientesSeleccionados.length === 0) {
        <p>No hay clientes seleccionados (se incluirán todos).</p>
        }
      </div>
    </mat-tab>

  </mat-tab-group>
</mat-card>
