<h2 mat-dialog-title>Preferencias</h2>

<mat-dialog-content>

    <div class="preferencia-item">

        <div class="preferencia-info">

            <mat-icon>{{ themeService.theme() === 'dark' ? 'dark_mode' : 'light_mode' }}</mat-icon>

            <span>Tema oscuro</span>

        </div>

        <mat-slide-toggle [checked]="themeService.theme() === 'dark'"
            (change)="cambiarTemaOscuro($event.checked)"></mat-slide-toggle>

    </div>

</mat-dialog-content>
