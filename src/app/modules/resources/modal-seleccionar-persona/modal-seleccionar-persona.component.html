<h2 mat-dialog-title>Seleccionar Persona</h2>

<mat-dialog-content class="mat-typography">

    <mat-form-field class="form-field-compacto" appearance="outline" style="width: 100%;">
        <mat-label>Buscar por documento o nombre</mat-label>
        <input matInput [formControl]="buscadorControl" placeholder="Ej: 900123, proveedor">
        <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>

    <div class="table-scroll-container">
        <table mat-table [dataSource]="dataSource">

            <ng-container matColumnDef="codTit">
                <th mat-header-cell *matHeaderCellDef>Documento</th>
                <td mat-cell *matCellDef="let element">{{ element.codTit }}</td>
            </ng-container>

            <ng-container matColumnDef="nombreCompleto">
                <th mat-header-cell *matHeaderCellDef>Nombre</th>
                <td mat-cell *matCellDef="let element">{{ element.nombreCompleto }}</td>
            </ng-container>

            <ng-container matColumnDef="actions">
                <th mat-header-cell *matHeaderCellDef></th>
                <td mat-cell *matCellDef="let element">
                    <button mat-icon-button color="primary" (click)="seleccionar(element)" matTooltip="Seleccionar">
                        <mat-icon>check_circle</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>

        @if (lista_personas.length === 0) {
        <p class="sin-resultados">No se encontraron personas.</p>
        }
    </div>

    <mat-paginator [length]="totalRegistros" [pageSize]="pageSize" [pageSizeOptions]="pageSizeOptions"
        [pageIndex]="paginaActual" (page)="cambiarPagina($event)" showFirstLastButtons></mat-paginator>

</mat-dialog-content>

<mat-dialog-actions align="end">
    <button mat-button (click)="cerrar()">Cerrar</button>
</mat-dialog-actions>
