<h2 mat-dialog-title>{{ data.titulo || 'Historial de Auditoría' }}</h2>
<mat-dialog-content>
    @if (logsOrdenados.length > 0) {
    <table mat-table [dataSource]="logsOrdenados">

        <ng-container matColumnDef="operacion">
            <th mat-header-cell *matHeaderCellDef>Operación</th>
            <td mat-cell *matCellDef="let log">{{ log.operacion }}</td>
        </ng-container>

        <ng-container matColumnDef="usuario">
            <th mat-header-cell *matHeaderCellDef>Usuario</th>
            <td mat-cell *matCellDef="let log">{{ log.usuario_mod }}</td>
        </ng-container>

        <ng-container matColumnDef="fecha">
            <th mat-header-cell *matHeaderCellDef>Fecha</th>
            <td mat-cell *matCellDef="let log">{{ log.fecha_mod }}</td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="columnas"></tr>
        <tr mat-row *matRowDef="let row; columns: columnas;"></tr>
    </table>
    } @else {
    <p>No hay historial disponible.</p>
    }
</mat-dialog-content>
<mat-dialog-actions align="end">
    <button mat-raised-button color="primary" type="button" (click)="cerrar()">Cerrar</button>
</mat-dialog-actions>
