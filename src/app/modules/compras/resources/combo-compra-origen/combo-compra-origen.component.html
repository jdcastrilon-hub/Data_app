<mat-form-field class="form-field-compacto mat-form-field" appearance="outline">
    <mat-label>Compra Origen</mat-label>
    <input matInput type="text" placeholder="N° OC o remito" [formControl]="searchControl"
        [matAutocomplete]="autoCompraOrigen">

    @if (searchControl.value) {
    <button mat-icon-button matSuffix (click)="limpiarCompraOrigen($event)" type="button">
        <mat-icon>close</mat-icon>
    </button>
    }
</mat-form-field>

<mat-autocomplete #autoCompraOrigen="matAutocomplete" [displayWith]="mascaraSalida" (optionSelected)="onSelected($event)">

    @for (item of filteredOptions(); track item.idTrans) {
    <mat-option [value]="item">
        OC {{ item.nroDocum }} - <small>{{ item.remito }} ({{ item.fecDoc | date:'dd/MM/yyyy' }})</small>
    </mat-option>
    }

</mat-autocomplete>
