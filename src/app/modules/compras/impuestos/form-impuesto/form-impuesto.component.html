<form [formGroup]="formulario" #formDirective="ngForm" (ngSubmit)="enviarFormulario()">
    <mat-card appearance="raised">
        <mat-card-header class="mat-header">
            <mat-card-title class="titulo-con-boton">
                <div class="titulo-izquierda">
                    <button mat-icon-button color="primary" type="button" (click)="volver()">
                        <mat-icon>list</mat-icon>
                    </button>
                    <span>{{titulo_form}}</span>
                </div>
                @if (isEditMode) {
                <button mat-icon-button color="primary" type="button" (click)="verHistorialAuditoria()"
                    title="Ver historial de auditoría">
                    <mat-icon>info</mat-icon>
                </button>
                }
            </mat-card-title>
        </mat-card-header>
        <div style="height: 1px; background-color: rgb(201, 199, 199); margin: 1px 0;"></div>
        <mat-tab-group animationDuration="0ms" mat-stretch-tabs="false" mat-align-tabs="start">

            <mat-tab label="Datos Generales">

                <div class="bloque">
                    <div fxLayout="row" fxLayout.lt-md="column" fxLayoutAlign="space-between stretch"
                        fxLayoutGap="10px">
                        <div fxFlex="20" fxFlex.lt-md="100%">
                            <mat-form-field class="form-field-compacto mat-form-field" appearance="outline">
                                <mat-label>Tipo de Impuesto</mat-label>
                                <mat-select formControlName="idTipo">
                                    @for (tipo of list_tipos; track tipo.id) {
                                    <mat-option [value]="tipo.id">{{tipo.nombreTipo}}</mat-option>
                                    }
                                </mat-select>
                                <mat-error>Debe seleccionar un tipo</mat-error>
                            </mat-form-field>
                        </div>
                        @if (isEditMode) {
                        <div fxFlex="20" fxFlex.lt-md="100%">
                            <mat-form-field class="form-field-compacto mat-form-field" appearance="outline">
                                <mat-label>Tasa</mat-label>
                                <input matInput formControlName="tasaImpuesto" readonly>
                            </mat-form-field>
                        </div>
                        }
                        <div fxFlex="20" fxFlex.lt-md="100%">
                            <mat-form-field class="form-field-compacto mat-form-field" appearance="outline">
                                <mat-label>Porcentaje</mat-label>
                                <input matInput type="number" formControlName="porcentaje" [readonly]="isReadOnly">
                                <span matTextSuffix>%</span>
                                <mat-error *ngIf="formulario.get('porcentaje')?.hasError('required')">Porcentaje requerido</mat-error>
                                <mat-error *ngIf="formulario.get('porcentaje')?.hasError('min')">No puede ser negativo</mat-error>
                                <mat-error *ngIf="formulario.get('porcentaje')?.hasError('max')">No puede superar 100%</mat-error>
                            </mat-form-field>
                        </div>
                        <div [fxFlex]="isEditMode ? 40 : 60" fxFlex.lt-md="100%">
                            <mat-form-field class="form-field-compacto mat-form-field" appearance="outline">
                                <mat-label>Nombre / Descripción</mat-label>
                                <input matInput formControlName="nombreTasa" readonly>
                            </mat-form-field>
                        </div>
                    </div>

                    
                </div>
            </mat-tab>

        </mat-tab-group>
        <br>

        <mat-card-actions class="mat-accion-botones">
            <button mat-raised-button color="primary" type="submit" *ngIf="!isReadOnly">Guardar</button>
            <br>
            <button mat-raised-button color="warn" type="button" *ngIf="!isReadOnly"
                (click)="volver()">Cancelar</button>
        </mat-card-actions>

    </mat-card>

</form>
