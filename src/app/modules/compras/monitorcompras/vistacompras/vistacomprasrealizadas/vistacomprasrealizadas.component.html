<div class="table-scroll-container">
    <table mat-table [dataSource]="dataSource">

        <ng-container matColumnDef="position">
            <th mat-header-cell *matHeaderCellDef>#</th>
            <td mat-cell *matCellDef="let element; let i = index">
                {{ i + 1 }}
            </td>
        </ng-container>
        <ng-container matColumnDef="id">
            <th mat-header-cell *matHeaderCellDef>Trans</th>
            <td mat-cell *matCellDef="let element">{{ element.id_trans}}</td>
        </ng-container>
        <ng-container matColumnDef="fecha">
            <th mat-header-cell *matHeaderCellDef>Fecha</th>
            <td mat-cell *matCellDef="let element">{{ element.fecha}}</td>
        </ng-container>
        <ng-container matColumnDef="proveedor">
            <th mat-header-cell *matHeaderCellDef>Proveedor</th>
            <td mat-cell *matCellDef="let element">{{ element.nombreproveedor}}</td>
        </ng-container>
        <ng-container matColumnDef="numoc">
            <th mat-header-cell *matHeaderCellDef>Num. OC</th>
            <td mat-cell *matCellDef="let element">{{ element.numoc}}</td>
        </ng-container>
        <ng-container matColumnDef="remito">
            <th mat-header-cell *matHeaderCellDef>Remito</th>
            <td mat-cell *matCellDef="let element">{{ element.remito}}</td>
        </ng-container>
        <ng-container matColumnDef="bodega">
            <th mat-header-cell *matHeaderCellDef>Bodega</th>
            <td mat-cell *matCellDef="let element">{{ element.nombrebodega}}</td>
        </ng-container>
        <ng-container matColumnDef="importe">
            <th mat-header-cell *matHeaderCellDef>Total</th>
            <td mat-cell *matCellDef="let element">{{ element.importe | currency:'COP':'symbol-narrow':'1.2-2' }}</td>
        </ng-container>

        <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef>Acciones</th>
            <td mat-cell *matCellDef="let element">


            </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

    </table>
    <mat-paginator [length]="totalRegistros" [pageSize]="pageSize" [pageSizeOptions]="pageSizeOptions"
        (page)="cambioPagina($event)" showFirstLastButtons></mat-paginator>

</div>
