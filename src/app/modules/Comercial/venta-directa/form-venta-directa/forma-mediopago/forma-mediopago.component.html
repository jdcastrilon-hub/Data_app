<div class="contenedor-pago">
    <div class="container-tabla mat-elevation-z2">
        <table mat-table [dataSource]="lineasPago()" class="mat-elevation-z1 w-100 m-top">


            <ng-container matColumnDef="formaPago">
                <th mat-header-cell *matHeaderCellDef> Forma de Pago </th>
                <td mat-cell *matCellDef="let element; let i = index">
                    <mat-form-field class="w-100 sub-form">
                        <mat-select [(ngModel)]="element.formaPago" (selectionChange)="actualizarValor()">
                            @for (opcion of opcionesPago; track opcion) {
                            <mat-option [value]="opcion">{{ opcion }}</mat-option>
                            }
                        </mat-select>
                    </mat-form-field>
                </td>
            </ng-container>

            <ng-container matColumnDef="valor">
                <th mat-header-cell *matHeaderCellDef class="text-right">Valor</th>
                <td mat-cell *matCellDef="let row; let i = index">
                    <input #inputCosto matInput formControlName="precio" placeholder="Nombre" class="text-right" />

                    <mat-error *ngIf="row.get('precio')?.hasError('required')">
                        La cantidad es obligatoria.
                    </mat-error>
                    <mat-error *ngIf="row.get('precio')?.hasError('min')">
                        La cantidad debe ser mayor a 0.
                    </mat-error>
                </td>
            </ng-container>

            <ng-container matColumnDef="observacion">
                <th mat-header-cell *matHeaderCellDef> Observación </th>
                <td mat-cell *matCellDef="let element">
                    <mat-form-field class="w-100 sub-form">
                        <input matInput type="text" [(ngModel)]="element.observacion" placeholder="Ej. No. Transacción">
                    </mat-form-field>
                </td>
            </ng-container>

            <ng-container matColumnDef="acciones">
                <th mat-header-cell *matHeaderCellDef class="text-center"> Acciones </th>
                <td mat-cell *matCellDef="let element; let i = index" class="text-center">
                    <button mat-icon-button color="warn" (click)="eliminarLinea(i)" title="Eliminar fila">
                        <mat-icon>delete</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
    </div>
    <div class="acciones-tabla">
        <button mat-flat-button color="primary" (click)="agregarLinea()">
            <mat-icon>add</mat-icon> Agregar Medio de Pago
        </button>
    </div>

    @if (devueltaGoblal() > 0) {
    <div class="contenedor-devuelta animated fadeIn">
        <span class="label-devuelta">Cambio / Devuelta al Cliente:</span>
        <span class="monto-devuelta">{{ devueltaGoblal() | currency }}</span>
    </div>
    }
</div>
