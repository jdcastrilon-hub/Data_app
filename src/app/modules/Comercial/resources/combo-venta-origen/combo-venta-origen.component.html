<mat-form-field class="form-field-compacto mat-form-field" appearance="outline">
    <mat-label>Factura Origen</mat-label>
    <input matInput type="text" placeholder="N° de factura" [formControl]="searchControl"
        [matAutocomplete]="autoVentaOrigen">

    @if (searchControl.value) {
    <button mat-icon-button matSuffix (click)="limpiarFacturaOrigen($event)" type="button">
        <mat-icon>close</mat-icon>
    </button>
    }
</mat-form-field>

<mat-autocomplete #autoVentaOrigen="matAutocomplete" [displayWith]="mascaraSalida" (optionSelected)="onSelected($event)">

    @for (item of filteredOptions(); track item.idTrans) {
    <mat-option [value]="item">
        Factura {{ item.serie }}-{{ item.nroDocum }} <small>({{ item.fecDoc | date:'dd/MM/yyyy' }})</small>
    </mat-option>
    }

</mat-autocomplete>
