<div class="contenedor-pago">
    <div >
        <table mat-table [dataSource]="lineasPago()" class="container-tabla mat-elevation-z2">


            <ng-container matColumnDef="formaPago">
                <th mat-header-cell *matHeaderCellDef> Forma de Pago </th>
                <td mat-cell *matCellDef="let element; let i = index">
                    <select [(ngModel)]="element.formaPago" (selectionChange)="actualizarValor()"
                        class="input-tabla-select">
                        @for (opcion of opcionesPago; track opcion) {
                        <option [value]="opcion">{{ opcion }}</option>
                        }
                    </select>
                </td>
            </ng-container>

            <ng-container matColumnDef="valor">
                <th mat-header-cell *matHeaderCellDef>Valor</th>
                <td mat-cell *matCellDef="let element">
                    <input matInput type="number" [(ngModel)]="element.valor" (input)="actualizarValor()"
                            placeholder="0.00" min="0" required class="text-right" #valorInput="ngModel" />
                    @if (valorInput.invalid && (valorInput.dirty || valorInput.touched)) {
                    <small class="error-texto">Obligatorio</small>
                    }
                </td>
            </ng-container>

            <ng-container matColumnDef="observacion">
                <th mat-header-cell *matHeaderCellDef> Observación </th>
                <td mat-cell *matCellDef="let element">
                   <input matInput type="text" [(ngModel)]="element.observacion"
                            placeholder="Ej. No. Transacción" />
                </td>
            </ng-container>
            <ng-container matColumnDef="acciones">
                <th mat-header-cell *matHeaderCellDef class="text-center"> Acciones </th>
                <td mat-cell *matCellDef="let element; let i = index" class="text-center">
                    <button mat-icon-button color="warn" (click)="eliminarLinea(i)" title="Eliminar fila">
                        <mat-icon>delete</mat-icon>
                    </button>
                </td>
            </ng-container>

            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
    </div>
    <div class="acciones-tabla">
        <button mat-flat-button color="primary" (click)="agregarLinea()">
            <mat-icon>add</mat-icon> Agregar Medio de Pago
        </button>
    </div>

    @if (devueltaGoblal() > 0) {
    <div class="contenedor-devuelta animated fadeIn">
        <span class="label-devuelta">Cambio / Devuelta al Cliente:</span>
        <span class="monto-devuelta">{{ devueltaGoblal() | currency }}</span>
    </div>
    }
</div>
