<main class="contenido">
    <mat-card appearance="raised">
        <mat-card-header class="mat-header">
            <mat-card-title>LISTAS DE PRECIO</mat-card-title>
        </mat-card-header>
        <div style="height: 1px; background-color: rgb(201, 199, 199); margin: 1px 0;"></div>

        <mat-card-actions class="mat-accion" style="display: flex; align-items: center;">
            <button mat-raised-button color="primary" routerLink="/listaprecios/new">Nuevo</button>
            <div style="flex: 1; display: flex; justify-content: center;">
                <mat-form-field class="form-field-compacto" appearance="outline"
                    style="width: 320px; margin-bottom: -1.25em;">
                    <mat-label>Buscar por nombre</mat-label>
                    <input matInput [formControl]="buscadorControl" placeholder="Ej: General, Mayorista">
                    <mat-icon matSuffix>search</mat-icon>
                </mat-form-field>
            </div>
        </mat-card-actions>
        <mat-card-content class="mat-content">
            <div class="table-scroll-container">
                <table mat-table [dataSource]="dataSource">
                    <ng-container matColumnDef="idLista">
                        <th mat-header-cell *matHeaderCellDef>id</th>
                        <td mat-cell *matCellDef="let element">{{ element.idLista }}</td>
                    </ng-container>
                    <ng-container matColumnDef="nombre">
                        <th mat-header-cell *matHeaderCellDef>Nombre</th>
                        <td mat-cell *matCellDef="let element">{{ element.nombre }}</td>
                    </ng-container>
                    <ng-container matColumnDef="cliente">
                        <th mat-header-cell *matHeaderCellDef>Cliente</th>
                        <td mat-cell *matCellDef="let element">{{ element.cliente?.nombreCompleto || '-' }}</td>
                    </ng-container>
                    <ng-container matColumnDef="esGeneral">
                        <th mat-header-cell *matHeaderCellDef>General</th>
                        <td mat-cell *matCellDef="let element">{{ element.esGeneral ? 'Si' : 'No' }}</td>
                    </ng-container>
                    <ng-container matColumnDef="activo">
                        <th mat-header-cell *matHeaderCellDef>Estado</th>
                        <td mat-cell *matCellDef="let element">
                            <span class="status-badge" [ngClass]="element.activo ? 'active' : 'inactive'">
                                {{ element.activo ? 'Activa' : 'Inactiva' }}
                            </span>
                        </td>
                    </ng-container>
                    <ng-container matColumnDef="actions">
                        <th mat-header-cell *matHeaderCellDef>Acciones</th>
                        <td mat-cell *matCellDef="let element">
                            <button mat-icon-button (click)="visualizarListaPrecio(element.idLista)"
                                matTooltip="Visualizar" matTooltipPosition="above">
                                <mat-icon>description</mat-icon>
                            </button>
                            <button mat-icon-button (click)="editarListaPrecio(element.idLista)">
                                <mat-icon>edit</mat-icon>
                            </button>
                            <button mat-icon-button matSuffix (click)="eliminarListaPrecio(element.idLista)">
                                <mat-icon>close</mat-icon>
                            </button>
                        </td>
                    </ng-container>

                    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                    <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

                </table>
            </div>
            <mat-paginator [length]="totalRegistros" [pageSize]="pageSize" [pageSizeOptions]="pageSizeOptions"
                [pageIndex]="paginaActual" (page)="cambiarPagina($event)" showFirstLastButtons></mat-paginator>
        </mat-card-content>
    </mat-card>
</main>
