<main class="contenido">
    <mat-card appearance="raised">
        <mat-card-header class="mat-header">
            <mat-card-title>GESTION DE CATEGORIAS</mat-card-title>
        </mat-card-header>
        <div style="height: 1px; background-color: rgb(201, 199, 199); margin: 1px 0;"></div>

        <mat-card-actions class="mat-accion" style="display: flex; align-items: center;">
            @if (puedeCrear) {
            <button mat-raised-button color="primary" routerLink="/categoria/new">Nuevo</button>
            }
            <div style="flex: 1; display: flex; justify-content: center;">
                <mat-form-field class="form-field-compacto" appearance="outline"
                    style="width: 320px; margin-bottom: -1.25em;">
                    <mat-label>Buscar por codigo o nombre</mat-label>
                    <input matInput [formControl]="buscadorControl" placeholder="Ej: bebidas, 001">
                    <mat-icon matSuffix>search</mat-icon>
                </mat-form-field>
            </div>
        </mat-card-actions>
        <mat-card-content class="mat-content">

            <div class="table-scroll-container">
                <table mat-table [dataSource]="dataSource">

                    <ng-container matColumnDef="codigo">
                        <th mat-header-cell *matHeaderCellDef>Codigo</th>
                        <td mat-cell *matCellDef="let element">{{ element.categoria}}</td>
                    </ng-container>
                    <ng-container matColumnDef="nombre">
                        <th mat-header-cell *matHeaderCellDef>Nombre</th>
                        <td mat-cell *matCellDef="let element">{{ element.nomCategoria }}</td>
                    </ng-container>
                    <ng-container matColumnDef="estado">
                        <th mat-header-cell *matHeaderCellDef>Estado</th>
                        <td mat-cell *matCellDef="let categoria">
                            <span class="status-badge" [ngClass]="categoria.estado? 'active' : 'inactive'">
                                {{ categoria.estado ? 'Activo' : 'Inactivo' }}
                            </span>
                        </td>
                    </ng-container>
                    <ng-container matColumnDef="actions">
                        <th mat-header-cell *matHeaderCellDef>Acciones</th>
                        <td mat-cell *matCellDef="let element">
                            <button mat-icon-button (click)="visualizarCategoria(element.id)" matTooltip="Visualizar"
                                matTooltipPosition="above">
                                <mat-icon>description</mat-icon>
                            </button>
                            @if (puedeEditar) {
                            <button mat-icon-button (click)="editarCategoria(element.id)">
                                <mat-icon>edit</mat-icon>
                            </button>
                            }
                            @if (puedeEliminar) {
                            <button mat-icon-button matSuffix (click)="eliminarCaegoria(element.id)">
                                <mat-icon>close</mat-icon>
                            </button>
                            }
                        </td>
                    </ng-container>
                    <tr mat-header-row *matHeaderRowDef="Columnas"></tr>
                    <tr mat-row *matRowDef="let row; columns: Columnas;"></tr>
                </table>
            </div>
            <mat-paginator [length]="totalRegistros" [pageSize]="pageSize" [pageSizeOptions]="pageSizeOptions"
                [pageIndex]="paginaActual" (page)="cambiarPagina($event)" showFirstLastButtons></mat-paginator>


        </mat-card-content>
    </mat-card>
</main>
